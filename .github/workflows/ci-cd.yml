name: VinKit CI/CD

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and publish (e.g. v1.0.1). Leave blank to run builds without creating a release.'
        required: false
        type: string
      description:
        description: 'Custom release description (prepended to auto-generated patch notes).'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m"
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require signing secrets for releases
        if: env.IS_RELEASE == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Release builds require the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets."
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > android/key.properties

      - name: Build Android Release APK
        run: |
          set -euo pipefail
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --target-platform android-arm64

          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*arm64-v8a-release.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one arm64 release APK, found ${#apks[@]}"
            ls -l build/app/outputs/flutter-apk/
            exit 1
          fi
          cp "${apks[0]}" build/app/outputs/flutter-apk/vinkit-android-arm64-release.apk

      - name: Verify APK is release-signed
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          CERTS="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/vinkit-android-arm64-release.apk)"
          echo "$CERTS"
          if grep -qi "Android Debug" <<< "$CERTS"; then
            echo "::error::APK is signed with the debug key, check the Gradle signingConfig"
            exit 1
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: vinkit-android-apk
          path: build/app/outputs/flutter-apk/vinkit-android-arm64-release.apk
          if-no-files-found: error

      - name: Upload Dart debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-symbols
          path: build/app/outputs/symbols
          if-no-files-found: error

  build-web:
    name: Build Web Bundle
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release
        run: |
          flutter build web --release
          cd build/web && zip -r ../vinkit-web-release.zip .

      - name: Upload Web Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: vinkit-web-release
          path: build/vinkit-web-release.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/vinkit-windows-x64-release.zip" -Force

      - name: Upload Windows Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: vinkit-windows-x64
          path: build/vinkit-windows-x64-release.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-web
      - build-windows
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      checks: read
      contents: write
      id-token: write
      statuses: read
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RAW_TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${RAW_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' derived from tag '$RAW_TAG'"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag_name=v$VERSION"
            echo "release_name=VinKit v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pubspec version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          if [ "${PUBSPEC_VERSION%%+*}" != "${VERSION%%+*}" ]; then
            echo "::error::Tag version '$VERSION' does not match pubspec.yaml version '$PUBSPEC_VERSION'"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: vinkit-*
          merge-multiple: true

      - name: Apply versioned asset names
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          mv vinkit-android-arm64-release.apk  "vinkit-${VERSION}-android-arm64-release.apk"
          mv vinkit-web-release.zip            "vinkit-${VERSION}-web-release.zip"
          mv vinkit-windows-x64-release.zip    "vinkit-${VERSION}-windows-x64-release.zip"
          ls -l

      - name: Enforce filename conventions
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "::error::Expected exactly 3 release assets, found ${#files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            name="${f##*/}"
            if [[ "$name" != "vinkit-${VERSION}-"* ]] || \
               [[ ! "$name" =~ -(android-arm64|web|windows-x64)-release\.(apk|zip)$ ]]; then
              echo "::error::Asset '$name' does not follow vinkit-${VERSION}-<platform>-release.<ext>"
              exit 1
            fi
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release-assets/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.description }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/vinkit-${{ steps.meta.outputs.version }}-android-arm64-release.apk
            release-assets/vinkit-${{ steps.meta.outputs.version }}-web-release.zip
            release-assets/vinkit-${{ steps.meta.outputs.version }}-windows-x64-release.zip
