name: VinKit CI/CD

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and publish (e.g. v1.0.1). Leave blank to run builds without creating a release.'
        required: false
        type: string
      description:
        description: 'Custom release description (prepended to auto-generated patch notes).'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/vinkit-android-release.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinkit-android-apk
          path: build/app/outputs/flutter-apk/vinkit-android-release.apk
          if-no-files-found: error

  build-web:
    name: Build Web Bundle
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release
        run: |
          flutter build web --release
          cd build/web && zip -r ../vinkit-web-release.zip .

      - name: Upload Web Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinkit-web-release
          path: build/vinkit-web-release.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/vinkit-windows-x64-release.zip" -Force

      - name: Upload Windows Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinkit-windows-x64
          path: build/vinkit-windows-x64-release.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-web
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            RAW_TAG="$INPUT_TAG"
          else
            RAW_TAG="$REF_NAME"
          fi
          if [[ "$RAW_TAG" != v* ]]; then
            NORMALIZED_TAG="v$RAW_TAG"
          else
            NORMALIZED_TAG="$RAW_TAG"
          fi
          echo "tag_name=$NORMALIZED_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=VinKit $NORMALIZED_TAG" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.description }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/vinkit-android-release.apk
            release-assets/vinkit-web-release.zip
            release-assets/vinkit-windows-x64-release.zip
