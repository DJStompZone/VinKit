<!DOCTYPE html>
<html lang="en-US">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VinKit automotive VIN barcode & OCR scanner and vehicle specification lookup.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121016">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VinKit">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicons -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>VinKit</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #121016;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #vinkit-web-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 25%, rgba(255, 151, 0, 0.16), transparent 45%),
                  radial-gradient(circle at 75% 75%, rgba(205, 61, 232, 0.18), transparent 48%),
                  #121016;
      transition: opacity 0.35s ease-out;
    }

    #vinkit-web-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .vk-badge {
      position: relative;
      width: 104px;
      height: 104px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(240, 93, 114, 0.36), 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .vk-badge img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .vk-scanline {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #FFF7E0, #FFFFFF, #FFF7E0, transparent);
      box-shadow: 0 0 12px #FF9700;
      animation: vk-sweep 1.25s ease-in-out infinite;
    }

    @keyframes vk-sweep {
      0% { top: 8%; opacity: 0.2; }
      50% { top: 86%; opacity: 1; }
      100% { top: 8%; opacity: 0.2; }
    }

    .vk-title {
      margin-top: 20px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: linear-gradient(135deg, #FF9700 0%, #F05D72 52%, #CD3DE8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .vk-sub {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.66);
    }
  </style>

  <script>
    (function () {
      var audioCtx = null;
      function ensureAudioContext() {
        var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) {
          return null;
        }
        if (!audioCtx) {
          audioCtx = new AudioContextCtor();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Warm up Web Audio on first user interaction to avoid first-beep lag.
      ['pointerdown', 'keydown'].forEach(function (evt) {
        window.addEventListener(evt, ensureAudioContext, { once: true, passive: true });
      });

      window.vinkitPlayScanBeep = function () {
        try {
          var ctx = ensureAudioContext();
          if (!ctx) {
            return false;
          }
          var now = ctx.currentTime;
          var osc = ctx.createOscillator();
          var filter = ctx.createBiquadFilter();
          var gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(3400, now);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(9500, now);
          filter.Q.setValueAtTime(0.7, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.11, now + 0.005);
          gain.gain.setValueAtTime(0.11, now + 0.225);
          gain.gain.linearRampToValueAtTime(0.0001, now + 0.26);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.265);
          return true;
        } catch (e) {
          return false;
        }
      };

      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('vinkit-web-splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(function () {
            if (splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 380);
        }
      });
    })();
  </script>
</head>
<body>
  <div id="vinkit-web-splash" aria-label="Loading VinKit">
    <div class="vk-badge">
      <img src="icons/Icon-192.png" alt="VinKit">
      <div class="vk-scanline"></div>
    </div>
    <div class="vk-title">VinKit</div>
    <div class="vk-sub">VIN Scanner &amp; Vehicle Specs</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
